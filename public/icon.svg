<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="일자리 알리미">
  <!-- 앱 아이콘 안에 이모지를 넣으면 기기·OS마다 다르게 그려지고, 아예 안 그려지는 곳도 있다.
       그래서 화면에서 쓰는 새싹 마크를 그대로 도형으로 그린다. -->
  <rect width="512" height="512" rx="112" fill="#1a5c2e"/>
  <!-- 도형이 실제로 차지하는 범위(x 7~18, y 7~21)의 가운데를 아이콘 가운데에 맞춘다 -->
  <g transform="translate(256 256) scale(13.5) translate(-12.5 -14)"
     fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21v-8"/>
    <path d="M12 13c0-3.3 2.7-6 6-6 0 3.3-2.7 6-6 6z"/>
    <path d="M12 15c0-2.8-2.2-5-5-5 0 2.8 2.2 5 5 5z"/>
  </g>
</svg>
