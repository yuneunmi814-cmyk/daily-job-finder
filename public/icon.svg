<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="일자리 알리미">
  <!-- 앱 아이콘 안에 이모지를 넣으면 기기·OS마다 다르게 그려지고, 아예 안 그려지는 곳도 있다.
       그래서 화면에서 쓰는 깃발 마크를 그대로 도형으로 그린다.
       (학교 앞 교통정리 깃발 — 노랑 팔레트를 고른 이유가 그 장면이다)
       선으로만 그리면 작은 크기에서 알파벳 P처럼 읽혀서, 깃면을 채웠다. -->
  <rect width="512" height="512" rx="112" fill="#FFC72C"/>
  <!-- 도형 범위(x 3.6~20.4, y 2~22)의 가운데를 아이콘 가운데에 맞춘다 -->
  <g transform="translate(256 256) scale(15) translate(-12 -12)" fill="#1A1A1A">
    <rect x="3.6" y="2" width="2.4" height="20" rx="1.2"/>
    <path d="M7.2 3h13.2v8.4c-2.2 1.3-4.4-1.3-6.6 0-2.2 1.3-4.4-1.3-6.6 0z"/>
  </g>
</svg>
