# 새올 접속이 왜 실패하는지 알아보려고 만든 진단용 워크플로. 수동 실행만 된다.
#
# ⚠️ 아껴 쓸 것. 2026-09-04에 한 시간 안에 수집·진단을 네 번 돌렸더니 그 뒤로
# 러너에서 92곳 전부 ConnectTimeout이 났다(같은 시각 한국에선 전부 정상 응답).
# 정부망이 러너를 막은 것으로 보인다. 돌리기 전에 한 시간쯤 쉬었는지 확인하고,
# 연달아 돌리지 말 것.
name: 새올 접속 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 러너 위치 확인
        run: curl -s --max-time 10 https://ipinfo.io | head -20 || echo "ipinfo 실패"
      - name: 시군별 접속 시도
        run: node scripts/probe.mjs
